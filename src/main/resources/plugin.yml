name: Eyes
version: "${project.version}"
main: xyz.censera.guestmode.GuestMode
api-version: "26.1"
description: Authentication, trust, and world protection for offline-mode Paper servers.
authors: [Censera]
softdepend: [floodgate, FastLogin, Geyser-Spigot, ViaVersion, ViaBackwards]

commands:
  eyes:
    description: Eyes administration commands.
    usage: /eyes <reload|list|kick-guests>
    permission: eyes.admin
  guest:
    description: Guest utility commands.
    usage: /guest <unstuck|nudge>
  register:
    description: Register your offline-mode account.
    usage: /register <password>
  login:
    description: Log in to your offline-mode account.
    usage: /login <password> [2fa-code]
  2fa:
    description: Manage two-factor authentication.
    usage: /2fa <enable|confirm|disable> [code]

permissions:
  eyes.admin:
    description: Access to all /eyes administration commands.
    default: op
  eyes.bypass:
    description: Skip Eyes authentication and guest restrictions.
    default: op
